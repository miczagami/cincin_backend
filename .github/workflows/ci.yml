name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cincin
          POSTGRES_PASSWORD: cincin
          POSTGRES_DB: cincin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cincin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Integration tests reset this database — the name must end in _test
      DATABASE_URL: postgresql://cincin:cincin@localhost:5432/cincin_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Unit tests
        run: npm test

      - name: API smoke tests (real Postgres)
        run: npm run test:integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t cincin-api .
