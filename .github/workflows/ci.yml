name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cincin
          POSTGRES_PASSWORD: cincin
          POSTGRES_DB: cincin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cincin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Integration tests reset this database — the name must end in _test
      DATABASE_URL: postgresql://cincin:cincin@localhost:5432/cincin_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Unit tests
        run: npm test

      - name: API smoke tests (real Postgres)
        run: npm run test:integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t cincin-api .

  # The app opens every link in src/services/appLinks.js (cincin_frontend tests/e2e/links.spec.js).
  # Run that check here too, so a backend change to the links can't pass without it.
  app-links:
    # Playwright 1.56 can't install browsers on ubuntu-latest (Ubuntu 26.04); pin until the app upgrades it
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cincin
          POSTGRES_PASSWORD: cincin
          POSTGRES_DB: cincin_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cincin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cincin:cincin@localhost:5432/cincin_e2e

    steps:
      - uses: actions/checkout@v4

      # Check against the app branch with the same name when there is one, else main
      - name: Pick app ref
        id: app
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/miczagami/cincin_frontend.git "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: miczagami/cincin_frontend
          ref: ${{ steps.app.outputs.ref }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Start the API (migrated + seeded)
        env:
          NODE_ENV: development
          PORT: 4000
          CORS_ORIGIN: http://localhost:3000
          APP_URL: http://localhost:3000
          AGE_VERIFY_PROVIDER: mock
          CRON_ENABLED: "false"
          RATE_LIMIT_MAX: "100000"
          AUTH_RATE_LIMIT_MAX: "100000"
        run: |
          npm ci
          npx prisma migrate deploy
          node prisma/seed.js
          nohup node src/server.js > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/health && exit 0; sleep 1; done
          cat "$GITHUB_WORKSPACE/api.log"; exit 1

      - name: App link check
        working-directory: app
        env:
          BACKEND_DIR: ${{ github.workspace }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/links.spec.js --project smoke

      - if: failure()
        run: cat "$GITHUB_WORKSPACE/api.log"
